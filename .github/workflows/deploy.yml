name: Deploy to SEOhost via SSH

on:
  push:
    branches:
      - main  # Uruchom po zmianach na gałęzi main

jobs:
  ssh-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # Pobierz kod z repozytorium

      - name: Copy files to server via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASSPHRASE }} # Jeśli klucz ma hasło
          source: ./ # Folder lokalny do wysłania (np. wp-content, lub cała strona jeśli chcesz)
          target: ${{ secrets.SSH_TARGET_DRONY }}  # Docelowy folder na serwerze

      - name: Clear WordPress cache (optional)
        run: |
          ssh -i ${{ secrets.SSH_PRIVATE_KEY }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << EOF
            echo "Clearing WordPress cache..."
            cd ${{ secrets.SSH_TARGET }}
            wp cache flush  # Jeśli masz zainstalowane wp-cli
            echo "Cache cleared"
          EOF

      - name: Restart web server (optional)
        run: |
          ssh -i ${{ secrets.SSH_PRIVATE_KEY }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << EOF
            echo "Restarting web server..."
            sudo systemctl restart apache2  # Jeśli używasz Apache
            # sudo systemctl restart nginx  # Jeśli używasz Nginx
            echo "Web server restarted"
          EOF

      - name: Deploy complete
        run: echo "Deployment complete!"
